name: Track ghealth upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: ghealth-upstream
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Open Health Agent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check out ghealth upstream
        run: git clone --quiet https://github.com/Google-Health-API/google-health-cli.git "$RUNNER_TEMP/google-health-cli"

      - name: Resolve update
        id: update
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/google-health-cli
        run: |
          pinned=$(sed -n 's/^COMMIT="\([0-9a-f]\{40\}\)"$/\1/p' scripts/install_ghealth.sh)
          latest=$(git -C "$UPSTREAM_DIR" rev-parse HEAD)
          test -n "$pinned"
          test -n "$latest"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$pinned" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.update.outputs.changed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            skills/open-health-agent/scripts/requirements.txt

      - name: Set up Go
        if: steps.update.outputs.changed == 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Generate pin update and change explanation
        if: steps.update.outputs.changed == 'true'
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/google-health-cli
          PR_BODY: ${{ runner.temp }}/ghealth-pr.md
        run: python scripts/update_ghealth_pin.py --upstream-dir "$UPSTREAM_DIR" --summary-file "$PR_BODY"

      - name: Test ghealth upstream
        if: steps.update.outputs.changed == 'true'
        working-directory: ${{ runner.temp }}/google-health-cli
        run: go test ./...

      - name: Build pinned ghealth and verify OHA command contract
        if: steps.update.outputs.changed == 'true'
        run: |
          scripts/install_ghealth.sh --install-dir "$RUNNER_TEMP/bin"
          python scripts/check_ghealth_compatibility.py --binary "$RUNNER_TEMP/bin/ghealth"

      - name: Install Open Health Agent test dependencies
        if: steps.update.outputs.changed == 'true'
        run: |
          python -m pip install --disable-pip-version-check -r skills/open-health-agent/scripts/requirements.txt
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run repository and regression tests
        if: steps.update.outputs.changed == 'true'
        run: |
          python scripts/update_ghealth_pin.py --verify
          python scripts/validate_repository.py
          python scripts/check_secrets.py
          python -m pytest -q

      - name: Open audited update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.update.outputs.latest }}
          PR_BODY: ${{ runner.temp }}/ghealth-pr.md
        run: |
          short=$(printf '%s' "$LATEST" | cut -c1-12)
          existing=$(gh pr list --state open --search "in:title $LATEST" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            pr_number=$existing
            branch=$(gh pr view "$pr_number" --json headRefName --jq '.headRefName')
            head_sha=$(gh pr view "$pr_number" --json headRefOid --jq '.headRefOid')
            echo "Resuming update PR #$pr_number from $branch"
          else
            branch="automation/ghealth-$short-$GITHUB_RUN_ID"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git add scripts/install_ghealth.sh README.md docs/ghealth-upstream-updates.md
            git commit -m "chore: sync ghealth upstream to $short"
            git push origin "$branch"
            head_sha=$(git rev-parse HEAD)
            pr_url=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "[automation] Sync ghealth to $LATEST" \
              --body-file "$PR_BODY")
            pr_number=${pr_url##*/}
          fi

          # Events created by GITHUB_TOKEN do not recursively trigger ordinary
          # pull_request workflows. workflow_dispatch is the supported
          # exception, so explicitly dispatch the full cross-platform CI matrix
          # for the generated branch and merge only after it succeeds.
          gh workflow run ci.yml --ref "$branch"
          run_id=""
          attempt=0
          while [ -z "$run_id" ] && [ "$attempt" -lt 30 ]; do
            attempt=$((attempt + 1))
            run_id=$(gh run list \
              --workflow ci.yml \
              --branch "$branch" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" \
              | head -n 1)
            if [ -z "$run_id" ]; then sleep 2; fi
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status
          gh pr merge "$pr_number" --squash --delete-branch
